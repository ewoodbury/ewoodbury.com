baseURL = "https://ewoodbury.com/"
title = "Ethan Woodbury"
copyright = "Copyright © 2025, Ethan Woodbury"
locale = "en-US"
theme = ["etch", "hugo-shortcode-gallery"]

[params]
  Description = "Ethan Woodbury's Website"
  dark = "off"
  highlight = true
  mainSections = ["posts"]

  # Contact/social-network identifiers for social icons
  EmailAddress = "ethwoodbury@gmail.com"
  GitHubUser = "ewoodbury"
  XUser = "etmwo"

  [params.author]
    name = "Ethan Woodbury"
    email = "ethwoodbury@gmail.com"

[imaging.exif]
    includeFields = ".*"

[[menu.main]]
name = "About"
url = "/about"
weight = 1

[markup.goldmark.renderer]
  # Allow HTML in Markdown (enables <details> tags and other HTML elements)
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true

  [markup.goldmark.extensions.passthrough.delimiters]
    inline = [['\(', '\)']]
    block = [['\[', '\]'], ['$$', '$$']]